<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>

   

    <main class="contenedor">

        <section class="introduccion">
            <h2>🕯️ Qué bueno que regresaste 🕯️</h2>
            
        </section>

        <form class="login" id="loginForm">

            <div class="calavera" aria-hidden="true">💀</div>

            <h2>Iniciar sesión</h2>
            <p class="subtitulo">
                Nos alegra tenerte de vuelta 🌼
            </p>

            <div class="separador">
                <span>🕯️ Tus datos de acceso 🕯️</span>
            </div>

            <div class="campo">
                <label for="usuario">Correo electrónico o usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Escribe tu correo o usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Escribe tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="opciones">
                <label class="mostrar">
                    <input type="checkbox" id="mostrarPassword">
                    <span>Mostrar contraseña</span>
                </label>
            </div>

            <p id="mensaje" class="mensaje" role="status"
               aria-live="polite"></p>

            <button type="submit">🌼 Entrar a mi cuenta 🌼</button>

            <div class="separador separador-inferior">
                <span>✿ ✦ ✿</span>
            </div>

            <p class="registro">
                ¿Todavía no tienes una cuenta?
                <a href="Formulario.html">Crear cuenta</a>
            </p>

        </form>

        <a class="volver" href="index.html">
            ← Volver ala pagina principal
        </a>

    </main>

    <footer>
        Hecho por el equipo Sunday
    </footer>

</body>
</html>
